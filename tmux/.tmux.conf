# Mushjulet scrollar i tmux egen buffert istallet for terminalens historik.
# Utan detta scrollar man i det som stod pa skarmen fore sessionen, och maste
# ga via `prefix [` for att lasa tillbaka pa riktigt.
set -g mouse on

# Men mouse on gor att dragmarkering hamnar i tmux buffert istallet for
# systemets urklipp. Defaultvardet `external` vidarebefordrar bara OSC 52
# fran program *inuti* tmux; `on` far tmux att skicka sina egna markeringar
# samma vag, sa de nar macOS urklipp aven over SSH.
set -g set-clipboard on
